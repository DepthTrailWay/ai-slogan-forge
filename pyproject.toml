[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-slogan-forge"
version = "0.7.3"
description = "AI slogan / tagline generator for Windows desktop — LLM-backed brand voice synthesis with offline fallback."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "slogan-forge maintainers", email = "dev@ai-slogan-forge.dev" }]
keywords = ["slogan", "tagline", "branding", "llm", "copywriting", "generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Endorsers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
local = ["llama-cpp-python>=0.2.79"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
slogan-forge = "sloganforge.bootstrap.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]